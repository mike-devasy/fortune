<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="shortcut icon" href="./assets/img/logo-fav.svg">
		<title>Fortune</title>
		<script type="module" crossorigin="" src="./js/index.min.js?v=1778712775658"></script>
		<link rel="modulepreload" crossorigin="" href="./js/common.min.js?v=1778712775658">
		<link rel="stylesheet" crossorigin="" href="./css/index.min.css?v=1778712775658">
	</head>
	<body>
		<div class="wrapper">
			<header data-fls-header="" data-fls-header-scroll="" class="header">
				<div class="header__container">
					<div class="header__logo">
						<picture>
							<img alt="" class="header__image" src="./assets/img/logo.webp">
						</picture>
					</div>
				</div>
			</header>
			<main class="page">
				<!-- @format -->
				<main class="page--home home">
					<section class="page__hero hero">
						<div class="hero__container">
							<div class="hero__content">
								<h1 class="hero__title">
									<p class="hero__label">Spin and get</p>
									<p class="hero__title-main">Huge</p>
									<p class="hero__title-sub">
										Cuatro
										<span>bonuses</span>
									</p>
								</h1>
								<div class="hero__slot slot">
									<div class="slot__reels">
										<div class="slot__reel">
											<div class="slot__window">
												<div class="slot__track" data-reel="0"></div>
											</div>
										</div>
										<div class="slot__reel">
											<div class="slot__window">
												<div class="slot__track" data-reel="1"></div>
											</div>
										</div>
										<div class="slot__reel">
											<div class="slot__window">
												<div class="slot__track" data-reel="2"></div>
											</div>
										</div>
									</div>
									<div class="slot__message" id="slotMessage">
										<span id="slotMessageText"></span>
									</div>
								</div>
								<div class="hero__button-wrapper button-wrapper">
									<button data-fls-button="" class="slot__button button" id="spinButton" type="button">
										SPIN
										<span id="spinCounter">4/4</span>
									</button>
								</div>
							</div>
						</div>
					</section>
				</main>
			</main>
			<footer data-fls-footer="" class="footer">
				<div class="footer__container"></div>
			</footer>
		</div>
	</body>
</html>
